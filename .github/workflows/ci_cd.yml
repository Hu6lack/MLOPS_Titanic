name: MLOps CI/CD — Titanic

# Déclenché à chaque push sur main ou develop
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  # ── Job 1 : Tests unitaires ──────────────────────────────────────────────────
  tests:
    name: Tests Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install scikit-learn xgboost pandas numpy pytest pytest-cov mlflow joblib

      - name: Lancer les tests avec couverture
        run: pytest tests/ -v --cov=src --cov-report=term-missing

  # ── Job 2 : Build Docker ─────────────────────────────────────────────────────
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: tests
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build de l'image
        run: docker build -t titanic-api:latest .

      - name: Test du container
        run: |
          docker run -d -p 8000:8000 --name test-api titanic-api:latest
          sleep 8
          curl -f http://localhost:8000/health
          docker stop test-api
